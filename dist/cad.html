<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCAD agent workflow visualization</title><link rel="stylesheet" href="cad.css"></head><body><div class="cad-window"><header><img src="assets/logos/autocad.svg" alt="AutoCAD"><strong>AutoCAD workflow</strong><span>Illustrative ship parts</span></header><div class="cad-toolbar"><div role="tablist" aria-label="CAD views"><button data-view="parts" role="tab" aria-selected="true">Components</button><button data-view="nest" role="tab" aria-selected="false">Plate nesting</button></div><button id="draw" type="button">Agents: draw & nest →</button></div><div class="cad-agents"><span data-agent="draft"><i aria-hidden="true">▣</i> Draft agent <b>○</b></span><span data-agent="nest"><i aria-hidden="true">▣</i> Nest agent <b>○</b></span><span data-agent="check"><i aria-hidden="true">▣</i> Check agent <b>○</b></span></div><div class="drawing-area"><canvas id="cad-canvas" aria-label="Animated CAD-style drawing of sample ship parts and their plate layout"></canvas><span class="cad-view-label" id="view-label">TOP / 2D WIREFRAME</span><span class="unit-label">mm</span></div><div class="cad-command"><span>Command:</span><output id="command" aria-live="polite">Ready. Watch the agents draft four components, then nest them on a plate.</output></div><footer><span id="cad-status">4 sample components</span><span>Browser workflow visualization</span></footer></div><script src="cad.js"></script></body></html>
