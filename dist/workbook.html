<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive BOM example</title><link rel="stylesheet" href="workbook.css"></head><body><div class="workbook"><header><div class="sheet-mark" aria-hidden="true">▦</div><strong>BOM workbook</strong><span>Illustrative data</span><button id="reset" type="button">Reset</button></header><div class="sheet-toolbar"><label><input type="checkbox" id="review-only"> Show review rows</label><span id="count" aria-live="polite"></span></div><div class="formula-bar"><output id="address">A2</output><span aria-hidden="true">fx</span><input id="cell-value" aria-label="Selected cell value" readonly><button id="apply" type="button" disabled aria-label="Apply cell edit">✓</button></div><div class="grid-scroll" tabindex="0" aria-label="Scrollable worksheet"><table id="grid" role="grid" aria-label="Sample bill of materials"></table></div><div class="cell-guidance" id="guidance" aria-live="polite">Select a quantity or revision cell to edit it.</div><nav aria-label="Worksheet tabs"><button data-sheet="Master BOM" aria-selected="true" role="tab">Master BOM</button><button data-sheet="Review queue" aria-selected="false" role="tab">Review queue</button><button data-sheet="Source pages" aria-selected="false" role="tab">Source pages</button></nav></div><script src="workbook.js"></script></body></html>
